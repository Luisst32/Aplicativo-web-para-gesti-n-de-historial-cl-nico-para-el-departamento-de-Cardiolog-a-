name: Deploy to AWS EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue Automático en EC2
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || secrets.HOST }}
          username: ${{ secrets.EC2_USER || secrets.USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.EC2_KEY || secrets.SSH_KEY || secrets.KEY }}
          port: ${{ secrets.EC2_PORT || 2222 }}
          command_timeout: 5m
          timeout: 60s
          script: |
            echo "=== INICIANDO DESPLIEGUE EN EC2 ==="
            cd /home/ec2-user/Aplicativo-web-para-gesti-n-de-historial-cl-nico-para-el-departamento-de-Cardiolog-a-
            
            echo "1. Descargando cambios de develop..."
            git fetch origin develop
            git checkout develop 2>/dev/null || git checkout -b develop origin/develop
            git pull origin develop
            
            echo "2. Entorno virtual..."
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d "env" ]; then
              source env/bin/activate
            fi
            
            if git diff HEAD@{1} --name-only 2>/dev/null | grep -q "requirements.txt"; then
              echo "requirements.txt cambio, instalando..."
              pip install --no-cache-dir --disable-pip-version-check -r requirements.txt || true
            else
              echo "Sin cambios en dependencias, saltando pip."
            fi
            
            echo "3. Migraciones y estaticos..."
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            
            echo "4. Programando recarga de la app..."
            touch config/wsgi.py
            
            # Crear script de recarga externo y ejecutarlo desacoplado
            # Asi la sesion SSH cierra LIMPIA y 2 segundos despues gunicorn se recarga
            cat > /tmp/reload_app.sh << 'EOF'
            #!/bin/bash
            sleep 2
            kill -HUP $(pgrep -o -x gunicorn 2>/dev/null) 2>/dev/null || true
            EOF
            chmod +x /tmp/reload_app.sh
            nohup /tmp/reload_app.sh </dev/null >/dev/null 2>&1 &
            disown 2>/dev/null || true
            
            echo "=== DESPLIEGUE COMPLETADO CON EXITO ==="
