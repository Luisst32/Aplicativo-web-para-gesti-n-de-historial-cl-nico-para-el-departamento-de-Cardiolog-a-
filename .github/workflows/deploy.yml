name: Verify and deploy to AWS EC2

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cardio_ci
          POSTGRES_USER: postgres
          # Ephemeral CI only; never a production credential.
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cardio_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: cardio_ci
      DB_USER: postgres
      DB_PASSWORD: ephemeral-ci-only
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements.txt
            requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-bootstrap.txt
          python -m pip install -r requirements.txt
          python -m pip check
          npm ci --prefix tests/frontend --ignore-scripts
      - name: Verify deployment failure handling
        run: python -m unittest discover -s tests -p 'test_deploy.py' -v
      - name: Backend checks, migration drift and all app test modules
        run: python scripts/verify_backend.py
      - name: Frontend XSS regressions
        run: npm test --prefix tests/frontend

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cardiounemi-production
      cancel-in-progress: false
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
      MIGRATION_ENV_FILE: ${{ vars.MIGRATION_ENV_FILE }}
      EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
    steps:
      - name: Require healthcheck URL and SSH fingerprint
        shell: bash
        run: |
          test -n "$DEPLOY_HEALTHCHECK_URL"
          test -n "$EC2_HOST_FINGERPRINT"
          test -n "$MIGRATION_ENV_FILE"
      - name: Deploy the verified commit synchronously
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || secrets.HOST }}
          username: ${{ secrets.EC2_USER || secrets.USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.EC2_KEY || secrets.SSH_KEY || secrets.KEY }}
          port: ${{ secrets.EC2_PORT || 2222 }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: DEPLOY_COMMIT,DEPLOY_HEALTHCHECK_URL,MIGRATION_ENV_FILE
          command_timeout: 15m
          timeout: 60s
          script: |
            set -eu
            cd /home/ec2-user/Aplicativo-web-para-gesti-n-de-historial-cl-nico-para-el-departamento-de-Cardiolog-a-
            git fetch origin develop
            gate_script=$(mktemp /tmp/cardio-deploy.XXXXXX.py)
            trap 'rm -f "$gate_script"' EXIT
            git show "$DEPLOY_COMMIT:scripts/deploy.py" > "$gate_script"
            python3.12 "$gate_script" --repository "$PWD" --commit "$DEPLOY_COMMIT" --healthcheck-url "$DEPLOY_HEALTHCHECK_URL"
