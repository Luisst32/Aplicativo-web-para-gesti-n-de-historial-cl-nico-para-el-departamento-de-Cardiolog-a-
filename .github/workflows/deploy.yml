name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Despliegue Automático en EC2
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || secrets.HOST }}
          username: ${{ secrets.EC2_USER || secrets.USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.EC2_KEY || secrets.SSH_KEY || secrets.KEY }}
          port: ${{ secrets.EC2_PORT || 2222 }}
          command_timeout: 15m
          timeout: 60s
          script: |
            echo "=== INICIANDO DESPLIEGUE EN EC2 ==="
            cd /home/ec2-user/Aplicativo-web-para-gesti-n-de-historial-cl-nico-para-el-departamento-de-Cardiolog-a-
            
            echo "1. Actualizando código desde Git..."
            git pull origin ${{ github.ref_name }}
            
            echo "2. Activando entorno virtual e instalando dependencias..."
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d "env" ]; then
              source env/bin/activate
            fi
            pip install --no-cache-dir --disable-pip-version-check -r requirements.txt || true
            
            echo "3. Migraciones y archivos estáticos..."
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            
            echo "4. Reiniciando servicio de aplicación..."
            if systemctl is-active --quiet gunicorn; then
              sudo systemctl restart gunicorn
            elif systemctl is-active --quiet cardiounemi; then
              sudo systemctl restart cardiounemi
            else
              sudo pkill -f gunicorn || true
              sleep 1
              nohup gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 > gunicorn.log 2>&1 &
            fi
            
            echo "=== DESPLIEGUE COMPLETADO CON ÉXITO ==="

