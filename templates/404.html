<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 | Página no encontrada - CARDIOUNEMI</title>
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/images/favicon.png' %}?v=20261114_01">
<link rel="icon" type="image/x-icon" href="{% static 'assets/images/favicon.ico' %}?v=20261114_01">
<link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}?v=20261114_01">
<style>
:root{
  --navy:#121D2D;
  --muted:#53657a;
  --border:#b8c4d2;
  --white:#ffffff;
  --cat:#111111;
  --shadow:#e5ebf2;
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:var(--white);
  color:var(--navy);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.error-page{
  height:100vh;
  height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px 20px;
  box-sizing:border-box;
  text-align:center;
}
.error-content{
  width:min(100%,720px);
  max-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.illustration{
  display:block;
  width:min(100%,540px);
  max-height:min(44vh,310px);
  height:auto;
  margin:0 auto 14px;
  overflow:visible;
}
.error-title{
  font-size:clamp(24px,3.6vw,38px);
  font-weight:750;
  line-height:1.18;
  letter-spacing:-.035em;
  margin:0 0 10px;
}
.error-description{
  color:var(--muted);
  font-size:clamp(14px,1.8vw,17px);
  line-height:1.5;
  margin:0 auto;
  max-width:580px;
}
.home-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:22px;
  padding:11px 22px;
  border:1px solid var(--border);
  border-radius:10px;
  color:#42566d;
  text-decoration:none;
  background:#fff;
  font-size:14.5px;
  font-weight:600;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
  min-height:42px;
}
.home-button:hover{background:#f4f7fa;border-color:#8295a9;color:var(--navy);transform:translateY(-1px)}
.home-button:focus-visible{outline:3px solid #389bfa;outline-offset:4px}
.home-button:active{transform:translateY(0)}
.home-button svg{width:18px;height:18px;flex-shrink:0}
.cat{transform-box:fill-box;transform-origin:center bottom;animation:breathe 4s ease-in-out infinite}
.tail{transform-box:view-box;transform-origin:280px 286px;animation:tail 5s ease-in-out infinite}
.sleep-z{animation:float 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sleep-z:nth-child(2){animation-delay:.55s}
.sleep-z:nth-child(3){animation-delay:1.1s}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes tail{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
@keyframes float{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-6px);opacity:1}}
@media(max-height:560px){
  .error-page{padding:10px 16px}
  .illustration{max-height:min(34vh,210px);margin-bottom:8px}
  .error-title{font-size:22px;margin-bottom:6px}
  .error-description{font-size:13px;line-height:1.35}
  .home-button{margin-top:14px;padding:8px 18px;min-height:36px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="error-page" aria-labelledby="error-title">
  <section class="error-content">
    <svg class="illustration" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-title art-desc">
      <title id="art-title">Error 404</title>
      <desc id="art-desc">Un gato negro minimalista duerme delante del número 404.</desc>

      <g fill="#121D2D" fill-rule="evenodd" stroke-linejoin="round">
        <path d="M143 33Q149 23 164 23H183Q205 23 205 46V207H220Q240 207 240 226V244Q240 261 220 261H205V294Q205 319 180 319H175Q150 319 150 294V261H44Q22 261 22 240V225Q22 214 31 201ZM150 118L94 207H150Z"/>
        <path d="M350 20C416 20 456 77 456 169S416 319 350 319 244 261 244 169 284 20 350 20ZM350 77C318 77 299 114 299 169S318 262 350 262 401 224 401 169 382 77 350 77Z"/>
        <path d="M583 33Q589 23 604 23H623Q645 23 645 46V207H660Q680 207 680 226V244Q680 261 660 261H645V294Q645 319 620 319H615Q590 319 590 294V261H484Q462 261 462 240V225Q462 214 471 201ZM590 118L534 207H590Z"/>
      </g>

      <ellipse cx="351" cy="323" rx="205" ry="14" fill="var(--shadow)"/>

      <g class="cat" fill="var(--cat)">
        <!-- tail -->
        <g class="tail">
          <path d="M280 286C231 285 193 303 191 326C189 348 213 359 239 356C262 353 274 342 273 329C272 318 264 314 251 315C235 317 225 325 224 333C223 338 226 342 231 343" fill="none" stroke="var(--cat)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- body -->
        <ellipse cx="345" cy="274" rx="88" ry="49"/>
        <!-- head -->
        <circle cx="433" cy="259" r="34"/>
        <!-- ears -->
        <path d="M409 233L420 205L432 232Z"/>
        <path d="M439 232L454 206L461 235Z"/>
        <!-- front paws -->
        <ellipse cx="417" cy="301" rx="22" ry="10"/>
        <ellipse cx="450" cy="301" rx="21" ry="10"/>
        <!-- hind paw -->
        <ellipse cx="300" cy="302" rx="26" ry="12"/>

      <!-- face -->
      <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M420 265Q425 270 430 265"/>
        <path d="M442 265Q447 270 452 265"/>
        <path d="M434 274Q437 277 440 274"/>
        <path d="M437 276V281Q433 284 429 281M437 281Q441 284 445 281" stroke-width="2.4"/>
        <path d="M420 277L403 274M420 284L402 284M452 277L470 274M452 284L470 285" stroke-width="2.4"/>
      </g>

      </g>

      <!-- sleep marks -->
      <g fill="none" stroke="#91a1b3" stroke-linecap="round" stroke-linejoin="round">
        <path class="sleep-z" d="M478 190h10l-10 13h11" stroke-width="3.5"/>
        <path class="sleep-z" d="M493 158h15l-15 17h15" stroke-width="4.5"/>
        <path class="sleep-z" d="M514 120h20l-20 22h21" stroke-width="5"/>
      </g>
    </svg>

    <h1 class="error-title" id="error-title">Página no encontrada</h1>
    <p class="error-description">La página que buscas no está disponible o ha cambiado de ubicación.</p>
    <a class="home-button" href="{% url 'home' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 10 9-7 9 7M5.5 8.5V21h5v-6h3v6h5V8.5"/>
      </svg>
      Volver al inicio
    </a>
  </section>
</main>
</body>
</html>
