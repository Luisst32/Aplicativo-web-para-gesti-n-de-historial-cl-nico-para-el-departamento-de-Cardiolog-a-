<!-- Modal de Confirmación de Eliminación Segura de Ficha Clínica con Contraseña -->
<div class="modal-overlay" id="modalEliminarFicha" style="display: none; align-items: center; justify-content: center; z-index: 9999;">
  <div class="modal-card" style="max-width: 480px; width: 92%; background: #ffffff; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Encabezado -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--slate-200, #e2e8f0);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 38px; height: 38px; border-radius: 8px; background: #fee2e2; color: #dc2626; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </div>
        <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--color-navy, #0f172a);">Eliminar Ficha Clínica</h3>
      </div>
      <button type="button" class="modal-close-btn" onclick="cerrarModalEliminarFicha()" title="Cerrar">&times;</button>
    </div>

    <!-- Cuerpo -->
    <div style="padding: 20px 22px;">
      <p style="font-size: 0.9rem; color: #334155; margin: 0 0 12px; line-height: 1.45;">
        ¿Está seguro de que desea eliminar la ficha clínica de <strong id="deleteModalPacienteNombre" style="color: #0f172a;">--</strong>?
      </p>

      <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.8rem; color: #991b1b; display: flex; gap: 8px; align-items: flex-start;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top: 1px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span>Esta acción es definitiva. Se borrarán permanentemente los antecedentes, exámenes y respuestas de la ficha.</span>
      </div>

      <div style="margin-bottom: 6px;">
        <label for="deleteModalPassword" style="display: block; font-size: 0.82rem; font-weight: 700; color: #334155; margin-bottom: 6px;">
          Ingrese su contraseña para autorizar:
        </label>
        <input 
          type="password" 
          id="deleteModalPassword" 
          class="form-input" 
          placeholder="Su contraseña de acceso..." 
          autocomplete="current-password" 
          style="width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 6px; border: 1.5px solid #cbd5e1; font-size: 0.9rem;"
          onkeydown="if(event.key==='Enter') ejecutarEliminacionFicha()"
        >
      </div>

      <div id="deleteModalError" style="display: none; color: #dc2626; font-size: 0.8rem; margin-top: 6px; font-weight: 600;"></div>
    </div>

    <!-- Pie -->
    <div style="padding: 14px 22px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px;">
      <button type="button" class="btn" onclick="cerrarModalEliminarFicha()" id="btnCancelarEliminarFicha">
        Cancelar
      </button>
      <button type="button" class="btn" onclick="ejecutarEliminacionFicha()" id="btnConfirmarEliminarFicha" style="background: #dc2626; color: #ffffff; border: 1px solid #dc2626; font-weight: 700; cursor: pointer;">
        Eliminar definitivamente
      </button>
    </div>

  </div>
</div>
