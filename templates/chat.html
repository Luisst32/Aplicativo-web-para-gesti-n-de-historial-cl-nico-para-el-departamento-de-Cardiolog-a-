<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARDIOUNEMI - Asistente Clínico & Estadístico</title>
  
  <!-- Tipografía Inter institucional -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos base y de layout compartidos del sistema -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>

  <!-- SIDEBAR (Navegación Unificada CARDIOUNEMI) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="assets/img/logo-cardiounemi.png" alt="CARDIOUNEMI" class="sidebar-logo">
      <div>
        <div class="sidebar-brand-title">CARDIOUNEMI</div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="sidebar-heading">Navegación</div>
      
      <a href="formularios-listado.html" class="nav-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Listado de Formularios</span>
      </a>

      <a href="dashboard-cardiounemi.html" class="nav-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>Dashboard</span>
      </a>
    </div>

    <a href="formularios-listado.html" class="nav-back" title="Regresar al listado de formularios">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Volver al Listado</span>
    </a>
  </aside>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="main-wrapper">

    <!-- BARRA SUPERIOR INSTITUCIONAL -->
    <header class="top-bar">
      <div class="page-title">
        <h1>Asistente Clínico & Estadístico</h1>
        <div class="badge-subtitulo">Soporte Analítico y Epidemiológico para la Salud Cardiovascular • Universidad Estatal de Milagro</div>
      </div>

      <div data-user-menu style="display: flex; align-items: center; gap: 10px;">
        <button type="button" class="btn" id="btn-limpiar-chat-page" style="font-size: 0.8rem; padding: 6px 14px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 6px; cursor: pointer; color: #475569;" title="Limpiar la conversación">
          Limpiar Conversación
        </button>
      </div>
    </header>

    <!-- WORKSPACE DEL CHAT -->
    <section class="chat-workspace" id="chat-page-workspace">

      <!-- Área de Mensajes del Chat: plantilla limpia al iniciar -->
      <main class="chat-page-messages" id="chat-page-messages">
        <!-- Área limpia de plantilla -->
      </main>

      <!-- Indicador animado de procesamiento -->
      <div id="typing-indicator-page" class="indicador-escribiendo oculto">
        <div class="burbuja-animada">
          <span class="punto"></span>
          <span class="punto"></span>
          <span class="punto"></span>
        </div>
        <span class="texto-procesando">CARDIOUNEMI está procesando los registros clínicos...</span>
      </div>

      <!-- Barra de Entrada de Consulta -->
      <footer class="chat-page-input-area">
        <form id="chat-page-form" onsubmit="return false;">
          <div class="chat-input-wrapper">
            <input
              type="text"
              id="chat-page-input"
              placeholder="Escriba su consulta clínica o estadística (ej. ¿cuántos docentes tienen riesgo alto?)..."
              autocomplete="off"
              required
            />
            <button type="submit" id="btn-enviar-chat-page" class="btn-send-main" title="Enviar consulta">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </form>
      </footer>

    </section>

  </div>

  <!-- Scripts: Dependencias locales y motor universal de chat -->
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/data/dashboard-cardiounemi-data.js"></script>
  <script src="js/pacientes.js"></script>
  <script src="js/menu-usuario.js"></script>
  <script src="js/chat-engine.js"></script>
</body>
</html>
